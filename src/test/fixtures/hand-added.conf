[defaultboot]
default=debian
prompt=1
timeout=5
target=/boot

[debian]
target=/boot
image=/boot/vmlinuz
ramdisk=/boot/initrd.img
parameters="root=/dev/mapper/pve-root"

[old]
target=/boot
image=/boot/vmlinuz.old
ramdisk=/boot/initrd.img.old
parameters="root=/dev/mapper/pve-root"
optional=1

[pve73]
target=/boot
image=/boot/vmlinuz-7.3.6-1+s390x1-pve
ramdisk=/boot/initrd.img-7.3.6-1+s390x1-pve
parameters="root=/dev/mapper/pve-root"
