# written by hand
[defaultboot]
	default = linux
	timeout = 10
	prompt = 1
	target = /boot

[linux]
	target = /boot
	image = /boot/vmlinuz
	ramdisk = /boot/initrd.img
	# two consoles
	parameters = "root=UUID=0a1b2c3d-1111-2222-3333-444455556666 rd.dasd=0.0.0200 console=ttysclp0 console=tty3270 quiet"
	secure = auto

