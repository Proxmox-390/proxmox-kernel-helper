[defaultboot]
default=debian
prompt=1
timeout=5
target=/boot

[debian]
target=/boot
image=/boot/vmlinuz
ramdisk=/boot/initrd.img
parameters="root=/dev/mapper/pve-root console=ttysclp0"

[old]
target=/boot
image=/boot/vmlinuz.old
ramdisk=/boot/initrd.img.old
parameters="root=/dev/mapper/pve-root console=ttysclp0"
optional=1
